- type: entity
  parent:
  - MCPouchStorage
  - MCPouchVisualizerOpen
  id: MCPouchGeneralLight
  name: light general pouch
  description: A general purpose pouch used to carry small items.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/small_drop.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1 # 1 slot

- type: entity
  parent:
  - MCPouchStorage
  - MCPouchVisualizerOpen
  id: MCPouchGeneralMedium
  name: medium general pouch
  description: A general purpose pouch used to carry small items.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/medium_drop.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1 # 2 slots

- type: entity
  parent: MCPouchGeneralMedium
  id: MCPouchGeneralLarge
  name: general pouch
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/large_drop.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,5,1 #3 slots

- type: entity
  parent: MCPouchStorage
  # No VisualizerOpen
  id: MCPouchStorageSmallSOM
  name: mining general pouch
  description: A general purpose pouch used to carry small items used during mining.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/general_som.rsi
    state: base
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1 # 1 slot

- type: entity
  parent: MCPouchStorageSmallSOM
  # No VisualizerOpen
  id: MCPouchGeneralLargeSOM
  name: general pouch
  description: A general purpose pouch used to carry small items used during mining.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/large_drop_som.rsi
    state: base
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,5,1 # 3 slot
