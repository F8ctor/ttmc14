- type: entity
  parent:
  - MCPouchStorage
  - MCPouchVisualizerOpen
  id: MCPouchMedicalInjector
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector.rsi
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,13,3 # 14 slots
    whitelist:
      tags:
      - MCAutoInjector
  - type: FixedItemSizeStorage

- type: entity
  parent: MCPouchStorage
  id: MCPouchMedicalInjectorICC
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors. This one looks to be made out of a synthetic tan fabric.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector_icc.rsi
    state: base
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,13,3 # 14 slots
    whitelist:
      tags:
      - MCAutoInjector
  - type: FixedItemSizeStorage

- type: entity
  parent: MCPouchMedicalInjectorICC
  id: MCPouchMedicalInjectorSOM
  name: medical injector pouch
  description: A specialized medical pouch that can only hold auto-injectors. This one looks to be made out of traditional SOM leather.
  components:
  - type: Sprite
    sprite: _MC/Clothing/Pouches/firstaid_injector_som.rsi
    state: base

- type: entity
