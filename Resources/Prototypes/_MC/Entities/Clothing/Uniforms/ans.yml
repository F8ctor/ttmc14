    sprite: _MC/Clothing/Uniforms/Factions/ANS/engineer.rsi
  - type: Clothing
    sprite: _MC/Clothing/Uniforms/Factions/ANS/engineer.rsi

- type: entity
  parent: MCUniformBase
  id: MCUniformANSSpecialist
