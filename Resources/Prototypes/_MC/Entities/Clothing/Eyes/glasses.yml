- type: entity
  parent: [ ClothingEyesHudMedical, BaseToggleClothing ]
  id: MCGlassesHudHealth
  name: HealthMate HUD
  description: A heads-up display that scans the humanoids in view and provides accurate data about their health status.
  components:
  - type: Tag
    tags:
    - MCGlassesHudHealth
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Eyes/Glasses/medicalhud.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Eyes/Glasses/medicalhud.rsi
  - type: ItemToggle
    activated: true
    soundActivate:
      path: /Audio/_RMC14/Machines/click.ogg
      params:
        variation: 0.250
    soundDeactivate:
      path: /Audio/_RMC14/Machines/click.ogg
      params:
        variation: 0.250
  - type: ToggleClothing
    action: RMCActionToggleMedhud
  - type: ComponentToggler
    components:
    - type: ShowHealthBars
      damageContainers:
      - Biological
    - type: HolocardScanner
    - type: ShowHealthIcons
      damageContainers:
      - Biological
  - type: RMCItemToggleClothingVisuals
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon-on }
          False: { state: icon }
  - type: Appearance
  - type: ItemToggleRequiresSkill
    skills:
      RMCSkillMedical: 1
  - type: ItemToggleDeactivateUnskilled
    skills:
      RMCSkillMedical: 1
    popup: rmc-skills-hud-toggle

- type: Tag
  id: MCGlassesHudHealth

- type: entity
  parent: ClothingEyesGlassesCheapSunglasses
  id: MCSunGlassesSpatialAgent
  suffix: MC, Admin
  name: spatial agent's sunglasses
  description: Glasses worn by a spatial agent.
  components:
  - type: HolocardScanner
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: ComponentToggler
    components:
    - type: SolutionScanner
  - type: ToggleClothing
    action: RMCActionToggleMedhud
  - type: NightVisionItem
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: FlashImmunity
  - type: Unremoveable
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _MC/Clothing/Eyes/Glasses/sunglasses.rsi
  - type: Clothing
    sprite: _MC/Clothing/Eyes/Glasses/sunglasses.rsi
    slots:
    - MASK
    - EYES

- type: entity
  parent: BaseToggleClothing
  id: MCGlassesHudMeson
  name: optical meson scanner
  description: Used to shield the user's eyes from harmful electromagnetic emissions, also used as general safety goggles. Not adequate as welding protection.
  components:
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _MC/Clothing/Eyes/Glasses/meson.rsi
  - type: Clothing
    sprite: _MC/Clothing/Eyes/Glasses/meson.rsi
    slots:
    - EYES
  - type: ItemToggle
    activated: true
    soundActivate:
      path: /Audio/_MC/Toggle/nightvision/googles_on.ogg
    soundDeactivate:
      path: /Audio/_MC/Toggle/nightvision/googles_off.ogg
  - type: NightVisionItem
    actionId: MCActionToggleMeson
  - type: RMCItemToggleClothingVisuals
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: Appearance
  # - type: ItemToggleRequiresSkill
  # - type: ItemToggleDeactivateUnskilled
