- type: entity
  parent: MCArmorModularSOM
  id: MCArmorModularLightSOM
  name: SOM scout armor
  description: The M-11 scout armor is a lightweight suit that that allows for minimal encumberance while still providing reasonable protection. Often seen on scouts or other specialist units that aren't normally getting shot at.
  components:
  - type: Sprite
    sprite: _MC/Clothing/OuterClothing/SOM/Armor/som_light_black.rsi
  - type: MCArmor
    soft:
      melee: 35
      bullet: 55
      laser: 50
      energy: 50
      bomb: 45
      bio: 45
      fire: 50
      acid: 40
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9

- type: entity
