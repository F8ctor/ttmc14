- type: entity
  parent: MCArmorModularLeaderSOM
  id: MCArmorModularOfficerSOM
  description: A bulky suit of heavy combat armor, the M-35 'Gorgon' armor provides the user with superior protection without severely impacting mobility. The gold markings on this one signify it is worn by a high ranking field officer. You'll need serious firepower to punch through this. Alt-Click to remove attached items. Use it to toggle the built-in flashlight.
  components:
  - type: Sprite
    sprite: _MC/Clothing/OuterClothing/SOM/Armor/som_officer_black.rsi
