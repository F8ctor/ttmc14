# Flamethrower
- type: entity
  parent: MCFire
  id: MCFireFlamethrower
  suffix: MC, Flame
  name: fire
  placement:
    mode: SnapgridCenter
  components:
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        MCBurn: 31
  - type: RMCIgniteOnCollide
    maxStacks: 20
    intensity: 31 # burn_level = 31
    duration: 10
    tileDamage:
      types:
        MCBurn: 0.1
  - type: TileFire
    id: MCFireFlamethrower
    duration: 17 # burn_time = 17
    extinguishInstantly: false

# Blue Flame
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerBlue
  suffix: MC, Blue
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: blue_4
  - type: PointLight
    color: "#5294ff"
  - type: RMCIgniteOnCollide
    maxStacks: 30
    intensity: 46 # burn_level = 46
    duration: 10
    tileDamage:
      types:
        MCBurn: 0.5
    armorMultiplier: 1
  - type: TileFire
    id: MCFireFlamethrowerBlue
    duration: 40 # burn_time = 40
    extinguishInstantly: false
    patExtinguishMultiplier: 2
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: blue_1 }
          Two: { state: blue_2 }
          Three: { state: blue_3 }
          Four: { state: blue_4 }

# Green Flame
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerGreen
  suffix: MC, Green
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: lime_3
  - type: PointLight
    color: "#7aff52"
  - type: RMCIgniteOnCollide
    maxStacks: 15
    intensity: 18 # burn_level = 18
    duration: 10
    tileDamage:
      types:
        MCBurn: 0.5
    armorMultiplier: 0.5
    armorWhitelist:
      components:
      - Xeno
  - type: TileFire
    id: MCFireFlamethrowerGreen
    duration: 20 # burn_time = 20 хз на унгах проверил там 20
    extinguishInstantly: false
    patExtinguishMultiplier: 2
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: lime_1 }
          Two: { state: lime_2 }
          Three: { state: lime_3 }

#RGB Flame
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerRGB
  suffix: MC, RGB
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: dynamic_4
  - type: DamageOnCollide
    damageDead: false
    fire: true
    damage:
      types:
        MCBurn: 16
        MCClone: 15
  - type: RMCIgniteOnCollide
    maxStacks: 20
    intensity: 18
    duration: 10
    tileDamage:
      types:
        MCBurn: 0.1
        MCClone: 0.4
  - type: TileFire
    id: MCFireFlamethrowerRGB
    duration: 25
    extinguishInstantly: false
  - type: RgbLightController
    layers: [ 0 ]
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: dynamic_1 }
          Two: { state: dynamic_2 }
          Three: { state: dynamic_3 }
          Four: { state: dynamic_4 }

# Volatile Flame
- type: entity
  parent: MCFire
  id: MCFireFlamethrowerVolatile
  suffix: MC, Volatile
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: hardred_3
  - type: PointLight
    color: "#a6a6a6"
    radius: 2
    energy: 3
  - type: RMCIgniteOnCollide
    maxStacks: 50
    intensity: 50
    duration: 10
    tileDamage:
      types:
        MCBurn: 1
    armorMultiplier: 1
  - type: TileFire
    id: MCFireFlamethrowerVolatile
    duration: 50
    extinguishInstantly: false
    sprayExtinguishMultiplier: 5
    patExtinguishMultiplier: 5
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: hardred_1 }
          Two: { state: hardred_2 }
          Three: { state: hardred_3 }
