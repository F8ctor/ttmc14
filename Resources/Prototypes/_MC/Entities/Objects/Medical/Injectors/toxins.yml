- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorSleepToxin
  name: anesthetic auto-injector
  description: An auto-injector loaded with 10 units of sleeping agent. Good to quickly pacify someone, for surgery of course.
  components:
  - type: Sprite
    sprite: _MC/Objects/Medical/autoinjectors.rsi
    layers:
    - state: autoinjector-8
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: autoinjector-8x
  - type: Hypospray
    transferAmount: 10
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: MCSleepToxin
          Quantity: 10
  - type: IconLabel
    labelTextLocId: mc-sleeptoxin-container-label-text
