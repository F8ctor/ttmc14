- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorQuickClotPlus
  name: quick-clot plus auto-injector
  description: An auto-injector loaded with 3 uses of quick-clot plus, a chemical designed to remove internal bleeding. Use with antitoxin. !DO NOT USE IN ACTIVE COMBAT!
  components:
  - type: Sprite
    sprite: _MC/Objects/Medical/autoinjectors.rsi
    layers:
    - state: autoinjector-7
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    changeColor: false
    emptySpriteName: autoinjector-7x
  - type: Hypospray
    transferAmount: 5
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: MCQuickClotPlus
          Quantity: 15
  - type: IconLabel
    labelTextLocId: mc-quickclotplus-container-label-text

- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorRussianRed
  name: emergency autoinjector
  description: An autoinjector loaded with a single use of Russian Red. Restores a significant amount of stamina and heals a large amount of damage, but causes slight permanent damage.
  components:
  - type: Sprite
    sprite: _MC/Objects/Medical/autoinjectors.rsi
    layers:
    - state: redwood
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    changeColor: false
    emptySpriteName: redwoodx
  - type: Hypospray
    transferAmount: 15
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: MCRussianRed
          Quantity: 20
        - ReagentId: MCOxycodone
          Quantity: 10
  - type: IconLabel
    labelTextLocId: mc-russian-red-container-label-text
