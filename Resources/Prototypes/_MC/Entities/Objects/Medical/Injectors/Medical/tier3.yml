- type: entity
  parent: MCAutoInjector
  id: MCAutoInjectorSynaptizineExpired
  name: expired synaptizine auto-injector
  description: An auto-injector said to be loaded with a safe-to-use synaptizine mix, 3 months past it's expiration date.
  components:
  - type: Hypospray
    transferAmount: 2
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 6
        reagents:
        - ReagentId: MCSynaptizine
          Quantity: 3
        - ReagentId: MCHyronalin
          Quantity: 3
  - type: IconLabel
    labelTextLocId: mc-synaptizine-expired-container-label-text
