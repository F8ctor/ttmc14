  #   sprite: _MC/Objects/Medical/Syringe/autoinjector.rsi
  #   layers:
  #   - state: mystery
  #   - state: mystery_x
  - type: Hypospray
    transferAmount: 6
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 18
        reagents:
        - ReagentId: MCSynaptizine
          Quantity: 6
        - ReagentId: MCHyronalin
