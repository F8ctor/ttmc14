- type: Tag
  id: MCFireExtinguisherPortable

- type: entity
  parent: FireExtinguisher
  categories: [ MCContent ]
  id: MCFireExtinguisher
  name: fire extinguisher
  description: A traditional red fire extinguisher.
  components:
  - type: Item
    sprite: _MC/Objects/Tools/fire_extinguisher.rsi
  - type: Spray
    transferAmount: 7
    sprayedPrototype: MCExtinguisherSpray
    vaporAmount: 3
    sprayDistance: 3
    sprayVelocity: 3
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 50
        reagents:
        - ReagentId: MCWater
          Quantity: 50
  - type: Sprite
    sprite: _MC/Objects/Tools/fire_extinguisher.rsi
    layers:
    - state: fire_extinguisher0
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: fire_extinguisher1 }
          False: { state: fire_extinguisher0 }
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: MCFireExtinguisher
  id: MCFireExtinguisherMini
  name: mini fire extinguisher
  description: A light and compact fibreglass-framed model fire extinguisher.
  components:
  - type: Item
    sprite: _RMC14/Objects/fire_extinguisher_mini.rsi
    size: Small
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 30
        reagents:
        - ReagentId: MCWater
          Quantity: 30
  - type: Sprite
    sprite: _RMC14/Objects/fire_extinguisher_mini.rsi
    layers:
    - state: minife1
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: minife1 }
          False: { state: minife0 }
  - type: Tag
    tags:
    - MCFireExtinguisherPortable

- type: entity
  parent: ExtinguisherSpray
  id: MCExtinguisherSpray
  categories: [ HideSpawnMenu ]
  components:
  - type: Undisposable
  - type: RMCExtinguisherPower
    power: 48


- type: entity
  parent: MCExtinguisherSpray
  id: MCExtinguisherSpraySpec
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCExtinguisherPower
    power: 96
