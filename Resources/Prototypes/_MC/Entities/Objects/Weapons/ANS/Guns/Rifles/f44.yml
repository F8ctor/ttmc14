- type: entity
  parent: [ MCWeaponGun, MCItem, RMCBaseAttachableHolder ]
  id: MCWeaponFlamerANS
  name: F44 flamethrower
  description: The AL2 corpse incinerator has proven itself to be one of the most effective means of incinerating biological matter. This weapon, more terrifying than hell itself, was banned from production and export as early as the 2100s, which makes this model unique.
  components:
  - type: Sprite
    sprite: _MC/Objects/Weapons/ANS/Guns/f44.rsi
    state: base
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: lit
      map: ["enum.RMCIgniterVisuals.Ignited"]
  - type: Item
    sprite: _MC/Objects/Weapons/ANS/Guns/f44.rsi
    size: Large
  - type: Clothing
    sprite: _MC/Objects/Weapons/ANS/Guns/f44.rsi
    slots:
    - suitStorage
    - Back
  - type: Gun
    cameraRecoilScalar: 0
    fireRate: 0.555
    resetOnHandSelected: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: MCFL84Shoot
    soundEmpty:
      path: /Audio/_MC/Weapons/Guns/Empty/flamethrower_empty.ogg
  - type: ShootUseDelay
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Tank
        startingItem: MCTankFlamerVolatile
        insertSound: /Audio/_MC/Weapons/Guns/Reload/flamethrower_reload.ogg
        ejectSound: /Audio/_MC/Weapons/Guns/Reload/flamethrower_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MCTankFlamerVolatile
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.6
    light: 0.75
    medium: 0.85
    heavy: 0.9
  - type: GunRequiresWield
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: RMCFlamerAmmoProvider
    spawn: null
  - type: AttachableHolder
    slots:
      mc-aslot-rail:
        whitelist:
          tags:
          - MCAttachmentRailFlashlight
          - MCAttachmentMagneticHarness
  - type: AttachableHolderVisuals
    offsets:
      mc-slot-rail: -0.032, 0.092
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/flamer_mouse.rsi
      state: all
  - type: RMCIgniter # Обещаю нахуй, эта хуйня будет отключатся при отсутствии магазина
    sound:
      path: /Audio/_MC/Weapons/Guns/Interact/flamethrower_off.ogg
      params:
        variation: 0.025
  - type: RMCAmmoEject
  - type: GenericVisualizer
    visuals:
      enum.RMCFlamerVisualLayers.Strip:
        enum.RMCFlamerVisualLayers.Strip:
          True: { visible: true }
          False: { visible: false }
      enum.RMCIgniterVisuals.Ignited:
        enum.RMCIgniterVisuals.Ignited:
          True: { visible: true }
          False: { visible: false }
  - type: Tag
    tags:
    - MCWeaponIncineratorF44
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        MCBrute: 5
    soundHit:
      collection: GenericHit

- type: Tag
  id: MCWeaponIncineratorF44
