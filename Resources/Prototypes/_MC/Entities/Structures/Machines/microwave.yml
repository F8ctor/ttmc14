- type: entity
  parent: [ CMMicrowave, MCStructure ]
  id: MCMicrowave
  components:
  - type: Sprite
    sprite: Structures/Machines/microwave.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: mw0
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: mw_unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
    - state: mwbloody0
      map: ["bloody"]
      visible: false
    - state: mwbloody1
      shader: unshaded
      map: ["bloodyunshaded"]
      visible: false
  - type: Machine
    board: MCCircuitboardMicrowave

- type: entity
  parent: CMBaseMachineCircuitboard
  id: MCCircuitboardMicrowave
  name: microwave machine board
  description: A machine printed circuit board for a microwave.
  components:
  - type: Sprite
    state: blank_mod
  - type: MachineBoard
    prototype: CMMicrowave